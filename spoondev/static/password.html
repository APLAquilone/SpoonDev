<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spoon Insights · パスワード変更</title><style>body{margin:0;background:#081c20;color:#ecfff8;font:16px system-ui;min-height:100dvh;display:grid;place-items:center}main{width:80%;max-width:400px;background:#102b30;padding:28px;border-radius:24px}label{display:block;margin:18px 0}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;font:inherit}input{margin-top:8px;background:#081c20;color:white;border:1px solid #42635b}button{background:#a6f4c5;border:0}#error{color:#ffb5b5}</style><main><p>SPOON INSIGHTS / ACCOUNT</p><h1>パスワードを変更</h1><p>初期パスワードを、ご自身のパスワードに変更してください。変更後は再ログインします。</p><form><label>現在のパスワード<input id="current" type="password" autocomplete="current-password" required maxlength="1024"></label><label>新しいパスワード（12文字以上）<input id="new" type="password" autocomplete="new-password" required minlength="12" maxlength="1024"></label><label>新しいパスワードの確認<input id="confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="1024"></label><button>変更して再ログイン</button><p id="error" role="alert"></p></form></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const $=id=>document.getElementById(id),button=document.querySelector('button');button.disabled=true;try{if($('new').value!==$('confirm').value)throw Error('確認用パスワードが一致しません。');const r=await fetch('/api/password',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':'CSRF_TOKEN'},body:JSON.stringify({current_password:$('current').value,new_password:$('new').value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.replace('/login')}catch(e){$('error').textContent=e.message}finally{button.disabled=false}};</script></html>
