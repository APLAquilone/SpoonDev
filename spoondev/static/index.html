<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpoonDev · リスナー検索</title>
<style>
:root{color-scheme:light;--ink:#203b3b;--muted:#617472;--teal:#087d76;--line:#dbe5df;--paper:#fffef9}*{box-sizing:border-box}body{margin:0;background:#f4f3e9;color:var(--ink);font:15px/1.6 system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:9px 14px}button:hover{border-color:var(--teal)}button:disabled{cursor:default;opacity:.5}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #57c6ad;outline-offset:3px}header{background:var(--teal);color:white;padding:32px max(24px,calc((100vw - 1120px)/2))}header small{letter-spacing:.12em}h1{margin:5px 0;font-size:30px}header p{margin:0;opacity:.9}.shell{max-width:1168px;margin:auto;padding:25px 24px}.stats{display:flex;gap:24px;flex-wrap:wrap;color:var(--muted);margin-bottom:20px}.stats strong{color:var(--ink)}.grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}h2{margin:0 0 15px;font-size:19px}form{display:flex;gap:8px}input{width:100%;min-width:0;padding:11px;border:1px solid var(--line);border-radius:9px;background:white}form button{background:var(--teal);color:white;flex:none}.hint,.sub,.empty{color:var(--muted);font-size:13px}.hint{margin:9px 0 17px}.person{display:block;width:100%;text-align:left;padding:12px 10px;margin:5px 0;border-color:transparent;background:transparent}.person.active{background:#e3f3ec;border-color:#b2dccf}.name{font-weight:650;overflow-wrap:anywhere}.sub{overflow-wrap:anywhere}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin:20px 0}.tabs button[aria-selected=true]{background:var(--teal);border-color:var(--teal);color:white}.relation{display:flex;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.relation .person{margin:0;padding:0;flex:1}.badge{font-size:11px;background:#fff0d8;color:#815e24;padding:2px 6px;border-radius:5px}.temperature{font-size:18px;color:var(--teal);font-weight:700;white-space:nowrap}.error{color:#a33e34;background:#fff0eb;padding:10px;border-radius:8px}.notice{margin-top:20px;color:var(--muted);font-size:12px}dialog{width:min(760px,calc(100vw - 32px));max-height:90vh;border:1px solid var(--line);border-radius:16px;padding:24px;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#173a3866}.dialog-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.dialog-head h2{margin:0}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.chart{width:100%;height:auto;background:#f2f7f1;border-radius:10px;margin:16px 0}.table-wrap{overflow:auto}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:760px){.grid{grid-template-columns:1fr}.shell{padding:18px 14px}header{padding:24px 20px}h1{font-size:25px}.card{padding:18px}.relation{flex-wrap:wrap}.relation .person{min-width:180px}.stats{gap:12px;font-size:13px}}

.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#favorite-toggle[aria-pressed=true]{background:#e3f3ec;border-color:var(--teal)}
#user-dialog{padding:0;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain}#user-dialog .user-dialog-head{position:sticky;top:0;background:var(--paper);z-index:1;padding:16px 20px;border-bottom:1px solid var(--line)}#user-dialog #detail-card{border:0;border-radius:0;padding:20px}#user-dialog .user-dialog-head button{min-height:44px}body.user-modal-open{overflow:hidden}@media(max-width:760px){#detail-slot{display:none}#user-dialog{width:calc(100vw - 24px)}#user-dialog #detail-card{display:block}.grid{display:block}}
</style>
<header><small>SPOONDEV / OBSERVATORY</small><h1>配信とリスナーのつながり</h1><p>ユーザーを探して、月間温度に基づく出現先を確認できます。</p></header>
<main class="shell"><div id="stats" class="stats" aria-live="polite">集計を読み込み中…</div><div class="grid">
<section class="card" aria-labelledby="search-title"><h2 id="search-title">ユーザーを検索</h2><div class="tabs" role="tablist" aria-label="ユーザーの探し方"><button id="search-view" role="tab" aria-selected="true">検索</button><button id="favorites-view" role="tab" aria-selected="false">お気に入り</button></div><div id="search-panel"><form id="search-form"><label class="sr" for="query">表示名、プロフィール ID、数値 ID</label><input id="query" placeholder="表示名 / プロフィール ID / 数値 ID" autocomplete="off"><button>検索</button></form><p class="hint">同じ表示名でも、数値 ID で区別します。</p><label class="hint"><input id="global-search" type="checkbox" checked style="width:auto"> Spoon全体から検索</label><p id="search-source" class="hint"></p><div id="users" aria-live="polite"></div><div class="pager"><button id="prev" disabled>前へ</button><span id="page" class="sub"></span><button id="next" disabled>次へ</button></div></div><div id="favorites-panel" hidden><p class="hint">このブラウザに保存されます。ユーザーの詳細から登録できます。</p><p id="favorites-activity-status" class="hint" role="status"></p><div id="favorites" aria-live="polite"></div></div><p id="favorites-error" class="error" role="alert" hidden></p></section>
<div id="detail-slot"><section id="detail-card" class="card" aria-label="ユーザーの詳細"><div id="profile"><h2 id="detail-title">ユーザーの記録</h2><p class="empty">左の検索結果からユーザーを選択してください。</p></div><div id="detail" aria-live="polite"></div></section></div>
</div><p class="notice">回数は定期取得で記録された観測回数です。滞在時間や全訪問回数を表しません。「部分取得」はリスナー一覧を最後まで取得できなかった記録です。日時は日本時間です。</p></main>
<dialog id="user-dialog" aria-labelledby="user-dialog-title"><div class="dialog-head user-dialog-head"><h2 id="user-dialog-title">ユーザーの詳細</h2><button id="close-user" aria-label="ユーザーの詳細を閉じる">閉じる</button></div><div id="user-dialog-body"></div></dialog>
<dialog id="history-dialog" aria-labelledby="history-title"><div class="dialog-head"><h2 id="history-title">温度の記録</h2><button id="close-history" aria-label="温度の記録を閉じる">閉じる</button></div><div id="history-content" aria-live="polite"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);let offset=0,query='',selected=null,tab='monthly',searchSeq=0,detailSeq=0,historySeq=0;let searchAbort,detailAbort,historyAbort;
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function state(target,text,error=false){target.replaceChildren(node('p',text,error?'error':'empty'))}
const date=value=>{if(!value)return '未取得';const d=new Date(value);return Number.isNaN(d.getTime())?'日時不明':new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(d)};
const temp=value=>typeof value==='number'&&Number.isFinite(value)?`${value.toLocaleString('ja-JP',{maximumFractionDigits:2})}°`:'—';
async function api(path,signal){const r=await fetch(path,{signal,headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`読み込みに失敗しました（${r.status}）`);return r.json()}
function identity(user){return `${user.tag?'@'+user.tag+' · ':''}ID ${user.id??user.user_id}`}
function person(user,onClick,active=false){const b=node('button',undefined,'person'+(active?' active':''));b.append(node('div',user.name||'名前なし','name'),node('div',identity(user),'sub'));b.addEventListener('click',onClick);return b}
const favoritesKey='spoondev.favorites.v1';let favorites=[];let favoriteActivity=new Map(),favoriteActivitySeq=0,favoriteActivityAbort;
function favoriteError(message){$('favorites-error').textContent=message;$('favorites-error').hidden=!message}
function readFavorites(){try{const saved=JSON.parse(localStorage.getItem(favoritesKey)||'[]');if(!Array.isArray(saved))throw new Error();const unique=new Map();for(const user of saved){if(user&&typeof user.id==='string'&&/^\d+$/.test(user.id))unique.set(user.id,{id:user.id,name:typeof user.name==='string'?user.name:'名前なし',tag:typeof user.tag==='string'?user.tag:''})}favorites=[...unique.values()];favoriteError('')}catch(e){favoriteError('お気に入りを読み込めませんでした。ブラウザの保存設定を確認してください。')}}
function isFavorite(id){return favorites.some(user=>user.id===String(id))}
function saveFavorites(next){try{localStorage.setItem(favoritesKey,JSON.stringify(next));favorites=next;favoriteError('');renderFavorites();updateFavoriteButton();refreshFavoriteActivity();return true}catch(e){favoriteError('お気に入りを保存できませんでした。ブラウザの保存設定や空き容量を確認してください。');const message=$('favorite-message');if(message)message.textContent='保存できませんでした。登録状態は変更されていません。';return false}}
function renderFavorites(){const target=$('favorites');target.replaceChildren();$('favorites-view').textContent=`お気に入り（${favorites.length}）`;if(!$('favorites-panel').hidden)$('search-title').textContent=`お気に入りのユーザー（${favorites.length}）`;if(!favorites.length){state(target,'お気に入りはまだありません。検索してユーザーの詳細から登録してください。');return}const recent=favorites.filter(user=>favoriteActivity.get(user.id)?.recent).sort((a,b)=>new Date(favoriteActivity.get(b.id).last_live_at)-new Date(favoriteActivity.get(a.id).last_live_at));const other=favorites.filter(user=>!favoriteActivity.get(user.id)?.recent);for(const [label,list]of [['最近配信に入っていたユーザー',recent],['お気に入りのユーザー',other]]){target.append(node('h3',label));if(!list.length)target.append(node('p',label==='最近配信に入っていたユーザー'?'直近30分以内のライブ観測はありません。':'全員が最近のライブ観測に含まれています。','empty'));for(const user of list){const row=node('div',undefined,'relation');const button=person(user,()=>selectUser(user.id),String(user.id)===String(selected?.id));const activity=favoriteActivity.get(user.id);if(activity?.last_live_at)button.append(node('div','最終ライブ観測 '+date(activity.last_live_at),'sub'));row.append(button);const remove=node('button','解除');remove.setAttribute('aria-label',`${user.name}をお気に入りから解除`);remove.addEventListener('click',()=>saveFavorites(favorites.filter(item=>item.id!==user.id)));row.append(remove);target.append(row)}}}
async function refreshFavoriteActivity(){const seq=++favoriteActivitySeq;favoriteActivityAbort?.abort();favoriteActivityAbort=new AbortController();if(!favorites.length){favoriteActivity.clear();$('favorites-activity-status').textContent='';return}const ids=favorites.map(user=>user.id),next=new Map();$('favorites-activity-status').textContent='ライブ観測を確認中…';try{let checked;for(let start=0;start<ids.length;start+=100){const data=await api('/api/favorites/activity?'+new URLSearchParams({ids:ids.slice(start,start+100).join(',')}),favoriteActivityAbort.signal);if(seq!==favoriteActivitySeq)return;for(const user of data.users)next.set(user.id,user);checked=data.checked_at}favoriteActivity=next;renderFavorites();$('favorites-activity-status').textContent='直近30分以内のリスナー観測を上段に表示します。現在視聴中とは限りません。30秒ごとに確認 · '+date(checked)}catch(e){if(seq===favoriteActivitySeq&&e.name!=='AbortError')$('favorites-activity-status').textContent='ライブ観測を確認できませんでした。前回の確認結果を表示しています。'}}
function updateFavoriteButton(){const button=$('favorite-toggle');if(!button||!selected)return;const registered=isFavorite(selected.id);button.textContent=registered?'★ お気に入り登録済み（解除）':'☆ お気に入りに登録';button.setAttribute('aria-pressed',String(registered))}
function toggleFavorite(){if(!selected)return;const id=String(selected.id),registered=isFavorite(id);if(saveFavorites(registered?favorites.filter(user=>user.id!==id):[...favorites,{id,name:selected.name||'名前なし',tag:selected.tag||''}]))$('favorite-message').textContent=registered?'お気に入りから解除しました。':'お気に入りに登録しました。'}
function switchView(view){const favorite=view==='favorites';$('search-panel').hidden=favorite;$('favorites-panel').hidden=!favorite;$('search-view').setAttribute('aria-selected',String(!favorite));$('favorites-view').setAttribute('aria-selected',String(favorite));$('search-title').textContent=favorite?`お気に入りのユーザー（${favorites.length}）`:'ユーザーを検索';if(favorite){renderFavorites();refreshFavoriteActivity()}}
$('search-view').addEventListener('click',()=>switchView('search'));$('favorites-view').addEventListener('click',()=>switchView('favorites'));
window.addEventListener('storage',event=>{if(event.key===favoritesKey||event.key===null){readFavorites();renderFavorites();updateFavoriteButton();refreshFavoriteActivity()}});
readFavorites();renderFavorites();refreshFavoriteActivity();
setInterval(()=>{if(!document.hidden)refreshFavoriteActivity()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshFavoriteActivity()});
async function loadUsers(){const seq=++searchSeq;searchAbort?.abort();searchAbort=new AbortController();state($('users'),'検索中…');$('prev').disabled=true;$('next').disabled=true;try{const data=await api('/api/users?'+new URLSearchParams({q:query,offset:String(offset),scope:$('global-search').checked?'spoon':'local'}),searchAbort.signal);if(seq!==searchSeq)return;$('search-source').textContent=data.warning||(data.source==='spoon_public_search'?'Spoonの公開検索結果（全アカウントの一覧ではありません）':'保存済みユーザーの検索結果');$('search-source').className=data.warning?'error':'hint';$('users').replaceChildren();if(!data.users.length)state($('users'),'該当するユーザーはありません。');for(const user of data.users)$('users').append(person(user,()=>selectUser(user.id),String(user.id)===String(selected?.id)));$('prev').disabled=offset===0;$('next').disabled=!data.has_more;$('page').textContent=`${Math.floor(offset/50)+1} ページ`;}catch(e){if(seq===searchSeq&&e.name!=='AbortError')state($('users'),e.message,true)}}
const mobileDetails=window.matchMedia('(max-width:760px)');
function openUserDetails(){if(!mobileDetails.matches)return;$('user-dialog-body').append($('detail-card'));if(!$('user-dialog').open)$('user-dialog').showModal();$('user-dialog').scrollTop=0;document.body.classList.add('user-modal-open')}
function restoreDesktopDetails(){if(mobileDetails.matches)return;if($('user-dialog').open)$('user-dialog').close();$('detail-slot').append($('detail-card'));document.body.classList.remove('user-modal-open')}
$('close-user').addEventListener('click',()=>{document.body.classList.remove('user-modal-open');$('user-dialog').close()});
$('user-dialog').addEventListener('close',()=>{document.body.classList.remove('user-modal-open');if(mobileDetails.matches){detailSeq++;detailAbort?.abort()}});
mobileDetails.addEventListener('change',restoreDesktopDetails);
async function selectUser(id){openUserDetails();const seq=++detailSeq;detailAbort?.abort();detailAbort=new AbortController();selected=null;$('profile').replaceChildren(node('h2','ユーザーの記録'));state($('detail'),'読み込み中…');try{const user=await api('/api/users/'+encodeURIComponent(id),detailAbort.signal);if(seq!==detailSeq)return;selected=user;$('profile').replaceChildren(node('h2',user.name||'名前なし'),node('div',identity(user),'sub'),node('p','プロフィール確認 '+date(user.last_seen_at),'sub'));const refresh=node('button','出現先を更新');refresh.addEventListener('click',()=>{selectUser(user.id);loadStats()});const favorite=node('button',undefined);favorite.id='favorite-toggle';favorite.addEventListener('click',toggleFavorite);const actions=node('div',undefined,'profile-actions');actions.append(favorite,refresh);const message=node('p',undefined,'hint');message.id='favorite-message';message.setAttribute('role','status');$('profile').append(actions,message);updateFavoriteButton();if(isFavorite(user.id)){const cached=favorites.find(item=>item.id===String(user.id));if(cached.name!==(user.name||'名前なし')||cached.tag!==(user.tag||''))saveFavorites(favorites.map(item=>item.id===String(user.id)?{id:String(user.id),name:user.name||'名前なし',tag:user.tag||''}:item))}renderDetail();}catch(e){if(seq===detailSeq&&e.name!=='AbortError')state($('detail'),e.message,true)}}
function renderDetail(){const target=$('detail');target.replaceChildren();const heading=node('h3','出現先');target.append(heading);const tabs=node('div',undefined,'tabs');tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','出現先の取得元');for(const[key,label]of [['monthly','月間温度'],['broadcasters','ライブ観測']]){const b=node('button',label);b.setAttribute('role','tab');b.setAttribute('aria-selected',String(tab===key));b.addEventListener('click',()=>{tab=key;renderDetail()});tabs.append(b)}target.append(tabs);if(tab==='monthly'){target.append(node('p',selected.profile_month?`${selected.profile_month} の月間ランキング · 取得 ${date(selected.profile_observed_at)}${selected.profile_complete?'':' · 部分取得'}`:'月間温度はまだ取得されていません。','hint'));target.append(node('p','月間温度は今月の活動の指標です。現在視聴中という意味ではありません。対象は取得済みの配信者ランキングです。','hint'))}else target.append(node('p','ライブで実際に観測された出現先です。過去の観測を含み、現在の視聴状態ではありません。','hint'));const list=(tab==='monthly'?selected.appearances:selected.broadcasters)||[];if(!list.length){target.append(node('p',tab==='monthly'?'取得済みの月間ランキングでは出現先が見つかりません。未取得の配信者への出現先は判断できません。':'ライブでの出現先はまだ観測されていません。','empty'));return}for(const row of list){const line=node('div',undefined,'relation');line.append(person(row,()=>selectUser(row.user_id)));const count=node('div',undefined,'sub');if(tab==='monthly'){count.append(node('div','月間ランキング'),node('div',selected.profile_month))}else{count.append(node('div',`${row.complete_count||0} 回の観測`));if(row.incomplete_count)count.append(node('span',`部分取得 ${row.incomplete_count} 回`,'badge'));count.append(node('div',date(row.last_seen_at)))}line.append(count,node('div',temp(tab==='monthly'?row.temperature:row.favorite_temperature),'temperature'));if(tab!=='monthly'){const b=node('button','温度履歴');b.setAttribute('aria-label',`${row.name||row.user_id}との温度履歴`);const pair={broadcaster_id:row.user_id,listener_id:selected.id};b.addEventListener('click',()=>loadHistory(pair,row.name));line.append(b)}target.append(line)}}
function chart(rows){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 640 190');svg.setAttribute('role','img');svg.setAttribute('aria-label','観測順の温度の推移。欠損値の区間は線で結びません。');svg.classList.add('chart');const values=rows.map(r=>r.favorite_temperature).filter(v=>typeof v==='number'&&Number.isFinite(v));if(!values.length)return node('p','温度の数値が記録されていません。','empty');let lo=Math.min(...values),hi=Math.max(...values);if(lo===hi){lo-=1;hi+=1}const x=i=>45+(rows.length===1?275:i/(rows.length-1)*550),y=v=>150-(v-lo)/(hi-lo)*120;function shape(tag,attrs){const e=document.createElementNS(svg.namespaceURI,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);svg.append(e);return e}shape('line',{x1:45,y1:150,x2:595,y2:150,stroke:'#b7c9bf'});let segment=[];function flush(){if(segment.length)shape('polyline',{points:segment.join(' '),fill:'none',stroke:'#087d76','stroke-width':2});segment=[]}rows.forEach((r,i)=>{const v=r.favorite_temperature;if(typeof v==='number'&&Number.isFinite(v)){segment.push(`${x(i)},${y(v)}`);shape('circle',{cx:x(i),cy:y(v),r:3,fill:r.complete?'#087d76':'#b17b28'})}else flush()});flush();shape('text',{x:8,y:35,fill:'#617472','font-size':11}).textContent=temp(hi);shape('text',{x:8,y:153,fill:'#617472','font-size':11}).textContent=temp(lo);shape('text',{x:45,y:178,fill:'#617472','font-size':11}).textContent='古い観測';shape('text',{x:535,y:178,fill:'#617472','font-size':11}).textContent='新しい観測';return svg}
async function loadHistory(pair,name){const seq=++historySeq;historyAbort?.abort();historyAbort=new AbortController();$('history-title').textContent=(name||'ユーザー')+' · 温度の記録';if(!$('history-dialog').open)$('history-dialog').showModal();state($('history-content'),'読み込み中…');try{const rows=await api('/api/history?'+new URLSearchParams(pair),historyAbort.signal);if(seq!==historySeq)return;const target=$('history-content');target.replaceChildren();if(!rows.length){state(target,'この組み合わせの記録はありません。');return}const ordered=[...rows].sort((a,b)=>new Date(a.observed_at)-new Date(b.observed_at));target.append(chart(ordered));const wrap=node('div',undefined,'table-wrap'),table=node('table'),head=node('thead'),tr=node('tr');for(const label of ['観測日時（日本時間）','温度','取得状態']){const th=node('th',label);th.scope='col';tr.append(th)}head.append(tr);table.append(head);const body=node('tbody');for(const r of [...ordered].reverse()){const tr=node('tr');tr.append(node('td',date(r.observed_at)),node('td',temp(r.favorite_temperature)),node('td',r.complete?'一覧取得完了':'部分取得'));body.append(tr)}table.append(body);wrap.append(table);target.append(wrap);}catch(e){if(seq===historySeq&&e.name!=='AbortError')state($('history-content'),e.message,true)}}
$('search-form').addEventListener('submit',e=>{e.preventDefault();query=$('query').value.trim();offset=0;loadUsers()});$('global-search').addEventListener('change',()=>{offset=0;loadUsers()});$('prev').addEventListener('click',()=>{offset=Math.max(0,offset-50);loadUsers()});$('next').addEventListener('click',()=>{offset+=50;loadUsers()});$('close-history').addEventListener('click',()=>$('history-dialog').close());$('history-dialog').addEventListener('close',()=>{historySeq++;historyAbort?.abort()});
function loadStats(){return api('/api/stats').then(s=>{$('stats').replaceChildren(node('span',`${s.user_count.toLocaleString()} ユーザー`),node('span',`${s.snapshot_count.toLocaleString()} ライブ観測`),node('span',`月間ランキング ${s.monthly_indexed_djs||0} 配信者`),node('span','最終取得 '+date(s.last_observed_at)))}).catch(e=>state($('stats'),e.message,true))}loadStats();setInterval(loadStats,30000);loadUsers();
</script>
</html>
