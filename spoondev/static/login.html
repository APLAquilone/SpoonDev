<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spoon Connection Insights · ログイン</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#18233d;font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;font-size:15px;line-height:1.7;min-height:100dvh}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 85% 0%,#e8ebff 0,transparent 45%);pointer-events:none}header{position:relative;max-width:1120px;margin:auto;padding:28px 32px;display:flex;align-items:center;gap:12px}.mark{height:34px;width:34px;display:grid;place-items:center;border-radius:11px;color:white;background:#5664df;font-weight:800;font-size:19px}.brand{font-size:14px;font-weight:750;letter-spacing:.01em}.brand small{display:block;color:#8490a8;font-size:10px;letter-spacing:.13em;font-weight:600}main{position:relative;max-width:1000px;margin:40px auto 64px;display:grid;grid-template-columns:1fr 1.05fr;background:#fff;border:1px solid #e2e7f1;border-radius:24px;overflow:hidden;box-shadow:0 20px 65px #2638660c}.intro{background:#19243f;color:#fff;padding:56px 44px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.intro:before{content:"";width:280px;height:280px;border:1px solid #ffffff0c;border-radius:50%;position:absolute;right:-140px;bottom:-100px}.eyebrow{font-size:10px;letter-spacing:.18em;font-weight:700;color:#a9b3ff;margin:0 0 24px}.intro h2{font-size:30px;line-height:1.6;font-weight:650;letter-spacing:.01em;margin:0 0 20px}.intro p{color:#b7c2d9;font-size:13px;margin:0;max-width:330px}.intro .line{height:1px;width:40px;background:#7985eb;margin:32px 0}.footnote{color:#8f9db8!important;font-size:11px!important}.form-panel{padding:48px 44px}.step{font-size:11px;color:#6878cb;font-weight:700;margin:0 0 12px}h1{font-size:24px;letter-spacing:.01em;line-height:1.5;margin:0 0 8px}.description{font-size:13px;color:#7b869c;margin:0 0 26px}label{display:block;margin:18px 0;color:#37435d;font-size:12px;font-weight:650}input{display:block;width:100%;margin-top:8px;padding:12px 14px;border:1px solid #dce2ed;border-radius:9px;background:#fcfdff;color:#18233d;font:inherit;font-size:16px;transition:border-color .15s,box-shadow .15s}input:hover{border-color:#b9c3d8}input:focus{outline:none;border-color:#6876df;box-shadow:0 0 0 3px #6876df1a}button{border:0;border-radius:9px;width:100%;padding:13px 16px;background:#5866dd;color:white;font:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px;box-shadow:0 4px 10px #5866dd20}button:hover{background:#4a58cb}button:focus-visible{outline:3px solid #adb6ff;outline-offset:3px}button:disabled{cursor:wait;opacity:.65}.hint{font-size:11px;color:#8792a8;margin:14px 0 0}#error{font-size:12px;color:#b73550;margin:16px 0 0;overflow-wrap:anywhere;min-height:20px}.privacy{font-size:11px;color:#8a96aa;display:flex;align-items:flex-start;gap:7px;margin-top:24px;padding-top:20px;border-top:1px solid #eef0f6}.privacy svg{flex:0 0 14px;margin-top:3px}footer{position:relative;color:#99a2b5;text-align:center;font-size:10px;margin:0 16px 28px}@media(max-width:760px){header{padding:20px 24px}main{margin:16px 24px 28px;max-width:460px;grid-template-columns:1fr;border-radius:18px}.intro{padding:25px 28px}.intro h2{font-size:21px;margin:0 0 8px}.intro .eyebrow{margin-bottom:12px;font-size:9px}.intro .line,.intro .footnote{display:none}.intro p{font-size:12px}.form-panel{padding:30px 28px}h1{font-size:22px}.description{margin-bottom:22px}}@media(max-width:360px){header{padding:16px}.brand{font-size:12px}main{margin:10px 14px 24px}.intro{padding:23px}.form-panel{padding:26px 23px}.intro h2{font-size:20px}h1{font-size:20px}}</style></head>
<body><header><span class="mark" aria-hidden="true">S</span><div class="brand">Spoon Connection Insights<small>YOUR CONNECTION DASHBOARD</small></div></header><main><section class="intro"><p class="eyebrow">YOUR LISTENING CONNECTIONS</p><h2>配信のつながりを、<br>ひとつの場所で。</h2><p>リスナーとのつながりや常連温度を、<br>わかりやすく振り返るためのダッシュボード。</p><div class="line"></div><p class="footnote">SPOON CONNECTION INSIGHTS</p></section><section class="form-panel"><p class="step">ACCOUNT / ログイン</p><h1>おかえりなさい。</h1><p class="description">ご自身のアカウントでログインしてください。</p><form id="login"><label for="username">ユーザー名<input id="username" autocomplete="username" required maxlength="64"></label><label for="password">パスワード<input id="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button type="submit">ログイン</button><p id="error" role="alert" aria-live="polite"></p></form><div class="privacy"><svg width="14" height="16" viewBox="0 0 16 18" fill="none" aria-hidden="true"><rect x="3" y="8" width="10" height="8" rx="2" stroke="currentColor"/><path d="M5 8V5a3 3 0 016 0v3" stroke="currentColor"/></svg><span>ダッシュボードの閲覧にはログインが必要です。</span></div></section></main><footer>Spoon Connection Insights</footer><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('button');b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.replace('/')}catch(e){document.querySelector('#error').textContent=e.message}finally{b.disabled=false}};</script></body></html>
