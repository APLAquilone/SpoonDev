<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpoonDev · Login</title><style>body{background:#081c20;color:#ecfff8;font:16px system-ui;margin:0;display:grid;min-height:100dvh;place-items:center}main{max-width:360px;width:80%;padding:32px;background:#102b30;border:1px solid #28534e;border-radius:24px}h1{letter-spacing:.1em}label{display:block;margin:20px 0}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:12px;border:1px solid #42635b;font:inherit}input{margin-top:8px;background:#081c20;color:white}button{background:#a6f4c5;color:#081c20;font-weight:bold;cursor:pointer}#error{color:#ffaaaa}</style><main><p>SPOONDEV / OBSERVATORY</p><h1>おかえりなさい。</h1><form id="login"><label>ユーザー名<input id="username" autocomplete="username" required maxlength="64"></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button>ログイン</button><p id="error" role="alert"></p></form></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('button');b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.replace('/')}catch(e){document.querySelector('#error').textContent=e.message}finally{b.disabled=false}};</script></html>
